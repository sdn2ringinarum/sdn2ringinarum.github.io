    // Helpers
    const esc = (str) => String(str ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

    const imgUrl = (url) => {
      if (!url) return "";
      const s = String(url).trim();
      if (s.startsWith("data:")) return s;
      const m = s.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=view&)?id=)([a-zA-Z0-9_-]+)/);
      return m && m[1] ? `https://lh3.googleusercontent.com/d/${m[1]}` : s;
    };

    const initials = (name) => {
      if (!name) return "SD";
      return name.split(" ").filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
    };

    const fmtDate = (d) => {
      if (!d) return "-";
      const dt = new Date(d);
      return isNaN(dt.getTime()) ? esc(d) : dt.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
    };

    // Urutkan Guru: Kepala Sekolah selalu di awal, diikuti Guru Kelas I-VI & Mapel
    const sortTeachers = (list) => {
      const getPriority = (roleStr) => {
        const r = String(roleStr || "").toLowerCase();
        if (r.includes("kepala sekolah")) return 1;
        if (r.includes("guru kelas 1") || r.includes("guru kelas i ") || r.endsWith("kelas i")) return 2;
        if (r.includes("guru kelas 2") || r.includes("guru kelas ii")) return 3;
        if (r.includes("guru kelas 3") || r.includes("guru kelas iii")) return 4;
        if (r.includes("guru kelas 4") || r.includes("guru kelas iv")) return 5;
        if (r.includes("guru kelas 5") || r.includes("guru kelas v")) return 6;
        if (r.includes("guru kelas 6") || r.includes("guru kelas vi")) return 7;
        if (r.includes("pai") || r.includes("agama")) return 8;
        if (r.includes("pjok") || r.includes("olahraga")) return 9;
        if (r.includes("operator") || r.includes("tata usaha")) return 10;
        return 50;
      };
      return [...list].sort((a, b) => getPriority(a.role) - getPriority(b.role));
    };

    // Urutkan Alumni: Tahun Lulus Terbaru dulu, kemudian Abjad Nama A-Z
    const sortAlumni = (list) => {
      return [...list].sort((a, b) => {
        const yearA = parseInt(a.graduationYear, 10) || 0;
        const yearB = parseInt(b.graduationYear, 10) || 0;
        if (yearB !== yearA) return yearB - yearA;
        return String(a.name || "").localeCompare(String(b.name || ""), "id", { sensitivity: "base" });
      });
    };

      if (!container) return;

        error: "bg-rose-950 border-rose-500/60 text-white",
        info: "bg-blue-950 border-blue-400/50 text-white"
      };
      const icons = {
        success: "fa-circle-check text-emerald-400",
        error: "fa-triangle-exclamation text-rose-400",
        info: "fa-circle-info text-amber-400"
      };
      el.className = `pointer-events-auto p-4 rounded-2xl border shadow-2xl flex items-start gap-3 transition-all duration-300 ${colors[type] || colors.success}`;
      el.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.success} text-lg mt-0.5 shrink-0"></i>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-xs">${esc(title)}</p>
          <p class="text-xs text-slate-300 mt-0.5 break-words">${esc(msg)}</p>

      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 300);
      }, 4200);
    };

    // Upload Gambar Wajib ke Google Drive (via Google Apps Script)
    const uploadMedia = async (file, category = "logo") => {
      const gasUrl = (state.cloud.gasUrl || "").trim();
      if (!gasUrl || !gasUrl.startsWith("http")) {
        throw new Error("URL Web App Google Apps Script belum diisi di menu Pengaturan > 8. Integrasi Cloud.");
      }

      const validTypes = ["image/png", "image/jpeg", "image/jpg", "image/webp", "image/gif"];
      if (!validTypes.includes(file.type)) {
        throw new Error("Format tidak didukung. Gunakan PNG, JPG, JPEG, WEBP, atau GIF.");
      }

      toast("Mengunggah ke Google Drive...", `Mengirim ${file.name} ke folder ${category}...`, "info");

      const isPng = file.type === "image/png";
      const isGif = file.type === "image/gif";
      const outputMime = isPng ? "image/png" : (isGif ? "image/gif" : "image/jpeg");

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (isGif) {
            resolve(ev.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            const maxDim = category === "logo" ? 600 : 1280;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL(outputMime, isPng ? undefined : 0.85));
          };
          img.onerror = () => reject(new Error("Gagal memproses file gambar."));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("Gagal membaca file dari perangkat."));
        reader.readAsDataURL(file);
      });

      const bodyParams = new URLSearchParams();
      bodyParams.append("base64", dataUrl);
      bodyParams.append("fileName", file.name);
      bodyParams.append("mimeType", outputMime);
      bodyParams.append("category", category);

      const res = await fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: bodyParams.toString()
      });

      const json = await res.json();
      if (json.status !== "success" || !json.url) {
        throw new Error(json.message || "Google Apps Script gagal menyimpan gambar ke Google Drive.");
      }

      toast("Unggah File Berhasil", `File ${file.name} berhasil diunggah ke Google Drive.`, "success");
      return json.url;
    };

            users: state.users,

        if (unsubCloud) { unsubCloud(); unsubCloud = null; }
        for (const a of window.__fbGetApps()) await window.__fbDeleteApp(a);

        db = window.__fbGetFirestore(app);
        const ref = window.__fbDoc(db, "sdn2ringinarum_data", "portal_state");
        const snap = await window.__fbGetDoc(ref);
        if (!snap.exists()) {
          await window.__fbSetDoc(ref, {
            school: state.school,
            teachers: state.teachers,
            alumni: state.alumni,
            gallery: state.gallery,
            feedbacks: state.feedbacks,
            users: state.users,
            teacherApps: state.teacherApps,
            cloudGasUrl: state.cloud.gasUrl || DEFAULT_GAS_URL,
            updatedAt: new Date().toISOString()
          });
        } else {
          const d = snap.data();
          isRemoteSyncing = true;
          if (d.school) state.school = { ...state.school, ...d.school };
          if (Array.isArray(d.teachers)) state.teachers = d.teachers;
          if (Array.isArray(d.alumni)) state.alumni = d.alumni;
          if (Array.isArray(d.gallery)) state.gallery = d.gallery;
          if (Array.isArray(d.feedbacks)) state.feedbacks = d.feedbacks;

          if (d.cloudGasUrl) state.cloud.gasUrl = d.cloudGasUrl;
          isRemoteSyncing = false;

          const prevConn = ui.cloudConnected;

            const d = s.data();
            const nextState = {
              school: d.school ? { ...state.school, ...d.school } : state.school,
              teachers: Array.isArray(d.teachers) ? d.teachers : state.teachers,
              alumni: Array.isArray(d.alumni) ? d.alumni : state.alumni,
              gallery: Array.isArray(d.gallery) ? d.gallery : state.gallery,
              feedbacks: Array.isArray(d.feedbacks) ? d.feedbacks : state.feedbacks,
              users: Array.isArray(d.users) && d.users.length ? d.users : state.users,
              teacherApps: Array.isArray(d.teacherApps) && d.teacherApps.length ? d.teacherApps : state.teacherApps
            };
            if (d.cloudGasUrl) state.cloud.gasUrl = d.cloudGasUrl;
            const nextHash = JSON.stringify(nextState);
            if (nextHash !== lastDataHash) {
              lastDataHash = nextHash;
              Object.assign(state, nextState);
              render();
              return;
            }
          }
          if (!prevConn && ui.tab === "pengaturan") {

function doPost(e) {
  try {
    var p = e.parameter || {};
    if ((!p.base64) &amp;&amp; e.postData &amp;&amp; e.postData.contents) {
      p = JSON.parse(e.postData.contents);
    }
    var raw = p.base64 || "";
    var mimeType = (p.mimeType || "image/jpeg").toLowerCase();

    var allowedCat = ["logo", "guru", "alumni", "galeri"];
    if (allowedCat.indexOf(category) === -1) category = "galeri";

    if (!raw) throw new Error("Data gambar kosong.");

    if (raw.indexOf(",") !== -1) {
      var parts = raw.split(",");
      var m = parts[0].match(/data:(image\\/[a-zA-Z0-9.+-]+);base64/i);
      if (m &amp;&amp; m[1]) mimeType = m[1].toLowerCase();
      raw = parts[1];
    }
    if (mimeType === "image/jpg") mimeType = "image/jpeg";
    var extMap = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif" };
    var ext = extMap[mimeType] || "jpg";
    var cleanName = fileName.replace(/\\.[^/.]+$/, "").replace(/[^a-zA-Z0-9_-]/g, "_") + "_" + Date.now() + "." + ext;

    var root = getOrCreateSubFolder(DriveApp.getRootFolder(), "Foto_Website_SDN2Ringinarum");
    var sub = getOrCreateSubFolder(root, category);
    var blob = Utilities.newBlob(Utilities.base64Decode(raw), mimeType, cleanName);
    var file = sub.createFile(blob);

    try {
      file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    } catch (shareErr) {
      // Tetap lanjut jika kebijakan domain membatasi setSharing
    }

    return ContentService.createTextOutput(JSON.stringify({
      status: "success",
      fileId: file.getId(),
      url: "https://lh3.googleusercontent.com/d/" + file.getId()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

                  <div><label class="font-bold text-slate-600">Auth Domain</label><input name="authDomain" value="${esc(fb.authDomain)}" class="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono bg-white" /></div>
                  <div><label class="font-bold text-slate-600">App ID</label><input name="appId" value="${esc(fb.appId)}" class="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono bg-white" /></div>
                </div>
              </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end">
              <button type="submit" class="px-6 py-3 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-bold text-sm shadow">
                <i class="fa-solid fa-plug-circle-check text-amber-400 mr-1.5"></i> Simpan & Hubungkan Cloud
              </button>
            </div>
          </form>

      }

      return `
        <div class="${ui.animateNext ? 'tab-panel-animate' : ''} max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center text-xl font-bold shrink-0"><i class="fa-solid fa-sliders"></i></div>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h1 class="font-heading text-xl font-extrabold">Panel Pengaturan Website</h1>
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${ui.cloudConnected ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'}">
                    ${ui.cloudConnected ? 'Firestore Terhubung' : 'Mode Offline / Lokal'}
                  </span>
                </div>
                <p class="text-xs text-slate-300 mt-1">Masuk sebagai <strong class="text-amber-400">${esc(ui.user.name)}</strong> (${esc(ui.user.role)})</p>
              </div>
            </div>

            </button>
          </div>

          <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <div class="flex items-center gap-1.5 min-w-max">
              ${subTabs.map(st => `
                <button onclick="App.setAdminSub('${st.id}')" class="px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${ui.adminSub === st.id ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                  <i class="${st.icon} ${ui.adminSub === st.id ? 'text-amber-400' : 'text-slate-400'}"></i> ${st.label}
                </button>
              `).join("")}
            </div>
          </div>

          ${subContent}
        </div>
      `;
    };

    const render = () => {
      syncChrome();
      const root = document.getElementById("app-root");
      if (ui.tab === "beranda") root.innerHTML = renderBeranda();
      else if (ui.tab === "aplikasi") root.innerHTML = renderAplikasi();
      else if (ui.tab === "saran") root.innerHTML = renderSaran();
      else if (ui.tab === "pengaturan") root.innerHTML = renderPengaturan();
      ui.animateNext = false;
    };

    // =========================================================
    // GLOBAL CONTROLLER METHODS
    // =========================================================
    const closeModal = () => {
      const m = document.getElementById("modal-layer");
      m.classList.add("hidden");
      m.innerHTML = "";
    };

    const showModal = (html) => {
      const m = document.getElementById("modal-layer");
      m.innerHTML = html;
      m.classList.remove("hidden");
    };

    window.App = {
      go(tab) {
        ui.tab = tab;
        ui.animateNext = true;
        if (tab === "aplikasi") ui.selectedAppId = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      },
      toggleMobileMenu(force) {
        const nav = document.getElementById("mobile-nav");
        const icon = document.getElementById("mobile-menu-icon");
        const open = typeof force === "boolean" ? force : nav.classList.contains("hidden");
        nav.classList.toggle("hidden", !open);
        icon.className = open ? "fa-solid fa-xmark text-lg" : "fa-solid fa-bars text-lg";
      },
      setTeacherFilter(f) { ui.teacherFilter = f; render(); },
      setAlumniSearch(v) {
        ui.alumniSearch = v;
        const wrap = document.getElementById("public-alumni-list");
        if (wrap) wrap.innerHTML = renderAlumniCardsHTML();
        else render();
      },
      setAlumniYear(v) {
        ui.alumniYear = v;
        const wrap = document.getElementById("public-alumni-list");
        if (wrap) wrap.innerHTML = renderAlumniCardsHTML();
        else render();
      },
      setAlumniLimit(v) {
        ui.alumniLimit = v;
        const wrap = document.getElementById("public-alumni-list");
        if (wrap) wrap.innerHTML = renderAlumniCardsHTML();
        else render();
      },
      setFeedbackRole(v) { ui.feedbackRole = v; render(); },
      setAdminSub(s) { ui.adminSub = s; render(); },
      renderAdminAlumniTableHTML() {
        const q = ui.adminAlumniSearch.toLowerCase().trim();
        const list = sortAlumni(state.alumni).filter(a => !q || a.name.toLowerCase().includes(q) || (a.nisn || "").includes(q) || (a.nextSchool || "").toLowerCase().includes(q));
        if (!list.length) {
          return `<div class="py-8 text-center text-slate-500 text-sm">${state.alumni.length ? "Tidak ditemukan data alumni yang cocok." : "Belum ada data alumni."}</div>`;
        }
        return `
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-y border-slate-200 text-[11px] font-bold uppercase text-slate-500">

                <th class="py-3 px-4">Tahun Lulus</th>
                <th class="py-3 px-4">NISN</th>
                <th class="py-3 px-4">SMP / MTs Tujuan</th>
                <th class="py-3 px-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
              ${list.map(a => `
                <tr>
                  <td class="py-3 px-4 font-bold text-slate-900">${esc(a.name)}</td>
                  <td class="py-3 px-4 text-xs font-bold text-blue-800">${esc(a.graduationYear)}</td>
                  <td class="py-3 px-4 text-xs font-mono text-slate-600">${esc(a.nisn || "-")}</td>
                  <td class="py-3 px-4 text-xs text-slate-700">${esc(a.nextSchool || "-")}</td>
                  <td class="py-3 px-4 text-right space-x-1">
                    <button onclick="App.openAlumniForm('${esc(a.id)}')" class="p-2 rounded-lg text-blue-700 hover:bg-blue-50"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button onclick="App.askDelete('alumni', '${esc(a.id)}', '${esc(a.name)}')" class="p-2 rounded-lg text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      },
      setAdminAlumniSearch(v) {
        ui.adminAlumniSearch = v;
        const wrap = document.getElementById("admin-alumni-table-wrap");
        if (wrap) wrap.innerHTML = App.renderAdminAlumniTableHTML();
        else render();
      },
      toggleGasGuide() { ui.showGasGuide = !ui.showGasGuide; render(); },
      openApp(id) { ui.selectedAppId = id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); },

      openLightbox(id) {
        const item = state.gallery.find(g => g.id === id);
        if (!item) return;
        showModal(`
          <div class="max-w-4xl w-full bg-slate-900 rounded-3xl overflow-hidden border border-slate-700 shadow-2xl" onclick="event.stopPropagation()">
            <div class="relative bg-black flex items-center justify-center max-h-[75vh]">
              <img src="${esc(imgUrl(item.imageUrl))}" referrerpolicy="no-referrer" class="max-h-[75vh] w-auto object-contain" />
              <button onclick="App.closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-900/80 text-white hover:bg-amber-400 hover:text-slate-950 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>
            <div class="p-5 text-white">
              <span class="text-[11px] font-bold text-amber-400 uppercase">${esc(item.category)} • ${fmtDate(item.date)}</span>
              <h3 class="font-heading font-bold text-lg">${esc(item.title)}</h3>
              ${item.description ? `<p class="text-xs text-slate-300 mt-1">${esc(item.description)}</p>` : ""}
            </div>
          </div>
        `);
      },
      closeModal,

      // Konfirmasi Hapus Kustom
      askDelete(type, id, label) {
        showModal(`
          <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 text-center space-y-4" onclick="event.stopPropagation()">
            <div class="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
              <h3 class="font-heading font-extrabold text-lg text-slate-900">Konfirmasi Penghapusan</h3>
              <p class="text-xs text-slate-600 mt-1">Apakah Anda yakin ingin menghapus data berikut secara permanen?</p>
              <div class="mt-3 px-4 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 font-bold text-xs break-words">${esc(label)}</div>
            </div>
            <div class="pt-2 flex gap-3">
              <button onclick="App.closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">Batal</button>
              <button onclick="App.doDelete('${esc(type)}', '${esc(id)}')" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Ya, Hapus Permanen</button>
            </div>
          </div>
        `);
      },
      async doDelete(type, id) {
        closeModal();
        if (type === "guru") state.teachers = state.teachers.filter(x => x.id !== id);
        else if (type === "alumni") state.alumni = state.alumni.filter(x => x.id !== id);
        else if (type === "galeri") state.gallery = state.gallery.filter(x => x.id !== id);
        else if (type === "saran") state.feedbacks = state.feedbacks.filter(x => x.id !== id);
        else if (type === "user") state.users = state.users.filter(x => x.id !== id);
        else if (type === "aplikasi") state.teacherApps = state.teacherApps.filter(x => x.id !== id);
        await persistData("Data berhasil dihapus.");
        render();
      },

      // Auth
      login(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const email = String(fd.get("email") || "").trim().toLowerCase();
        const password = String(fd.get("password") || "");
        const u = state.users.find(x => x.email.toLowerCase() === email && x.password === password);
        if (!u) { toast("Login Gagal", "Email/username atau kata sandi salah.", "error"); return; }
        if (!u.active) { toast("Akun Nonaktif", "Akun administrator ini sedang dinonaktifkan.", "error"); return; }
        ui.user = { id: u.id, name: u.name, email: u.email, role: u.role };
        sessionStorage.setItem(SS_AUTH_KEY, JSON.stringify(ui.user));
        toast("Selamat Datang", `Berhasil masuk sebagai ${u.name}.`, "success");
        render();
      },
      logout() {
        ui.user = null;
        sessionStorage.removeItem(SS_AUTH_KEY);
        toast("Keluar", "Sesi administrator diakhiri.", "info");
        render();
      },

      // Public Feedback
      async submitFeedback(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.feedbacks.unshift({
          id: "fb-" + Date.now(),
          senderName: String(fd.get("senderName")).trim(),
          role: String(fd.get("role")),
          rating: Number(fd.get("rating")) || 5,
          message: String(fd.get("message")).trim(),
          approved: false,
          createdAt: new Date().toISOString().split("T")[0]
        });
        e.target.reset();
        await persistData("Terima kasih! Pesan Anda terkirim dan menunggu moderasi admin.");
        render();
      },

      // Profil & Logo
      async uploadLogo(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const url = await uploadMedia(file, "logo");
          if (url) {
            state.school.logoUrl = url;
            await persistData("Logo sekolah & ikon website diperbarui!");
            render();
          }
        } catch (err) {
          toast("Gagal Memproses Logo", err.message, "error");
        }
      },
      async saveProfile(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.school.name = String(fd.get("name")).trim();
        state.school.npsn = String(fd.get("npsn")).trim();
        state.school.slogan = String(fd.get("slogan")).trim();
        state.school.academicYear = String(fd.get("academicYear")).trim();
        state.school.accreditation = String(fd.get("accreditation")).trim();
        state.school.activeStudents = Number(fd.get("activeStudents")) || 0;
        state.school.dapoUrl = String(fd.get("dapoUrl") || "https://dapo.kemendikdasmen.go.id/sekolah?npsn=20321740").trim();
        state.school.email = String(fd.get("email")).trim();
        state.school.phone = String(fd.get("phone")).trim();
        state.school.address = String(fd.get("address")).trim();
        state.school.logoUrl = String(fd.get("logoUrl")).trim();
        state.school.vision = String(fd.get("vision")).trim();
        state.school.missions = String(fd.get("missions")).split("\n").map(x => x.trim()).filter(Boolean);
        await persistData("Profil sekolah berhasil disimpan!");
        render();
      },

      // Upload helper inside modals
      async uploadToInput(e, inputId, category) {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const url = await uploadMedia(file, category);
          const inp = document.getElementById(inputId);
          if (inp && url) inp.value = url;
        } catch (err) {
          toast("Gagal Unggah", err.message, "error");
        }
      },

      // CRUD Guru
      openTeacherForm(id = null) {
        const t = id ? state.teachers.find(x => x.id === id) : { id: "", name: "", nip: "", role: "", status: "Aktif", statusNote: "Pensiun", servicePeriod: "", photoUrl: "" };
        showModal(`
          <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 class="font-heading font-bold text-lg">${id ? "Edit Data Guru" : "Tambah Guru Baru"}</h3>
              <button onclick="App.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="App.saveTeacher(event, '${esc(id || "")}')" class="space-y-3.5">
              <div><label class="block text-xs font-bold mb-1">Nama Lengkap & Gelar *</label><input name="name" value="${esc(t.name)}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-xs font-bold mb-1">NIP</label><input name="nip" value="${esc(t.nip)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
                <div><label class="block text-xs font-bold mb-1">Jabatan *</label><input name="role" value="${esc(t.role)}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold mb-1">Status *</label>
                  <select name="status" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white">
                    <option value="Aktif" ${t.status === "Aktif" ? "selected" : ""}>Aktif</option>
                    <option value="Tidak Aktif" ${t.status !== "Aktif" ? "selected" : ""}>Tidak Aktif (Purnabakti)</option>
                  </select>
                </div>
                <div><label class="block text-xs font-bold mb-1">Masa Bakti</label><input name="servicePeriod" value="${esc(t.servicePeriod)}" placeholder="2015 - Sekarang" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              </div>
              <div><label class="block text-xs font-bold mb-1">Keterangan Purnabakti (jika tidak aktif)</label><input name="statusNote" value="${esc(t.statusNote || "Pensiun")}" placeholder="Pensiun / Pindah Tugas" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              <div>
                <label class="block text-xs font-bold mb-1">Foto Guru (PNG/JPG/JPEG)</label>
                <div class="flex gap-2">
                  <label class="cursor-pointer px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold shrink-0">
                    Pilih Foto <input type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" onchange="App.uploadToInput(event, 't-photo-inp', 'guru')" class="hidden" />
                  </label>
                  <input id="t-photo-inp" name="photoUrl" value="${esc(t.photoUrl)}" placeholder="Atau URL foto..." class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs" />
                </div>
              </div>
              <div class="pt-3 flex justify-end gap-2">
                <button type="button" onclick="App.closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-blue-800 text-white text-xs font-bold">Simpan</button>
              </div>
            </form>
          </div>
        `);
      },
      async saveTeacher(e, id) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const obj = {
          id: id || ("t-" + Date.now()),
          name: String(fd.get("name")).trim(),
          nip: String(fd.get("nip")).trim(),
          role: String(fd.get("role")).trim(),
          status: String(fd.get("status")),
          statusNote: String(fd.get("statusNote")).trim(),
          servicePeriod: String(fd.get("servicePeriod")).trim(),
          photoUrl: String(fd.get("photoUrl")).trim()
        };
        if (id) {
          const idx = state.teachers.findIndex(x => x.id === id);
          if (idx !== -1) state.teachers[idx] = obj;
        } else {
          state.teachers.push(obj);
        }
        closeModal();
        await persistData("Data guru disimpan!");
        render();
      },
      downloadTeacherXLS() {
        const ws = XLSX.utils.json_to_sheet([{ "Nama Lengkap": "Budi Santoso, S.Pd.", "NIP": "19880101 201502 1 001", "Jabatan": "Guru Kelas III", "Status": "Aktif", "Keterangan Purnabakti": "", "Masa Bakti": "2015 - Sekarang" }]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Guru");
        XLSX.writeFile(wb, "Template_Data_Guru_SDN2Ringinarum.xlsx");
      },
      importTeacherXLS(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = async (ev) => {
          const wb = XLSX.read(ev.target.result, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          rows.forEach((row, i) => {
            if (row["Nama Lengkap"]) {
              const aktif = String(row["Status"] || "Aktif").toLowerCase() === "aktif";
              state.teachers.push({
                id: "t-imp-" + Date.now() + i,
                name: String(row["Nama Lengkap"]),
                nip: String(row["NIP"] || ""),
                role: String(row["Jabatan"] || "Guru"),
                status: aktif ? "Aktif" : "Tidak Aktif",
                statusNote: aktif ? "" : String(row["Keterangan Purnabakti"] || "Purnabakti"),
                servicePeriod: String(row["Masa Bakti"] || ""),
                photoUrl: ""
              });
            }
          });
          await persistData(`Berhasil mengimpor ${rows.length} data guru!`);
          render();
        };
        r.readAsArrayBuffer(file);
      },

              <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-xs font-bold mb-1">Tahun Lulus *</label><input name="graduationYear" value="${esc(a.graduationYear)}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
                <div><label class="block text-xs font-bold mb-1">NISN</label><input name="nisn" value="${esc(a.nisn)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-xs font-bold mb-1">Sekolah Lanjutan (SMP/MTs)</label><input name="nextSchool" value="${esc(a.nextSchool)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" /></div>

              </div>

                <label class="block text-xs font-bold mb-1">Foto Alumni</label>

        const ws = XLSX.utils.json_to_sheet([{ "Nama Lengkap": "Rizka Amalia", "Tahun Lulus": "2026", "NISN": "0134567890", "Sekolah Lanjutan": "SMP N 1 Ringinarum", "No HP": "08123456789" }]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Alumni");
        XLSX.writeFile(wb, "Template_Data_Alumni_SDN2Ringinarum.xlsx");
      },
      importAlumniXLS(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = async (ev) => {
          const wb = XLSX.read(ev.target.result, { type: "array" });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          rows.forEach((row, i) => {
            if (row["Nama Lengkap"]) {
              state.alumni.unshift({
                id: "a-imp-" + Date.now() + i,
                name: String(row["Nama Lengkap"]),
                graduationYear: String(row["Tahun Lulus"] || "2026"),
                nisn: String(row["NISN"] || ""),
                nextSchool: String(row["Sekolah Lanjutan"] || ""),
                phone: String(row["No HP"] || ""),
                photoUrl: ""
              });
            }
          });
          await persistData(`Berhasil mengimpor ${rows.length} data alumni!`);
          render();
        };
        r.readAsArrayBuffer(file);
      },

      // Cloud Settings
      async saveCloud(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.cloud.gasUrl = String(fd.get("gasUrl") || DEFAULT_GAS_URL).trim();
        state.cloud.firebase.projectId = String(fd.get("projectId") || DEFAULT_FIREBASE.projectId).trim();
        state.cloud.firebase.apiKey = String(fd.get("apiKey") || DEFAULT_FIREBASE.apiKey).trim();
        state.cloud.firebase.authDomain = String(fd.get("authDomain") || DEFAULT_FIREBASE.authDomain).trim();
        state.cloud.firebase.appId = String(fd.get("appId") || DEFAULT_FIREBASE.appId).trim();
        await connectFirebase();
        await persistData("Konfigurasi Cloud berhasil disimpan & dihubungkan ulang!");
      },
      copyGas() {
        const el = document.getElementById("gas-snippet");
        if (!el) return;
        const r = document.createRange();
        r.selectNode(el);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(r);
        document.execCommand("copy");
        window.getSelection().removeAllRanges();
        toast("Tersalin", "Kode Code.gs berhasil disalin.", "success");
      },
      async testGasConnection() {
        const inp = document.getElementById("gas-url-input");
        const url = (inp ? inp.value : state.cloud.gasUrl || "").trim();
        if (!url || !url.startsWith("http")) {
          toast("URL Kosong", "Masukkan URL Web App Google Apps Script terlebih dahulu.", "error");
          return;
        }
        try {
          const res = await fetch(url);
          const json = await res.json();
          if (json.status === "ok") {
            toast("Koneksi Berhasil", "Endpoint Google Apps Script aktif dan siap menerima gambar!", "success");
          } else {
            toast("Respon Tidak Dikenal", "URL merespon tetapi bukan endpoint Code.gs yang valid.", "error");
          }
        } catch (err) {
          toast("Koneksi Gagal", "Pastikan Web App di-deploy dengan akses 'Siapa saja (Anyone)'.", "error");
        }
      }
    };

    document.getElementById("modal-layer").addEventListener("click", closeModal);

    // Boot Immediately & Synchronously (Zero White Flash)
    render();
  </script>

  <!-- FIREBASE SDK LOADER (NON-BLOCKING BACKGROUND SYNC) -->
  <script type="module">
    import { initializeApp, getApps, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    window.__fbInitializeApp = initializeApp;
    window.__fbGetApps = getApps;
    window.__fbDeleteApp = deleteApp;
    window.__fbGetFirestore = getFirestore;
    window.__fbDoc = doc;
    window.__fbGetDoc = getDoc;
    window.__fbSetDoc = setDoc;
    window.__fbOnSnapshot = onSnapshot;
    window.__fbReady = true;

    if (typeof window.__startCloudSync === "function") {
      window.__startCloudSync();
    }
  </script>
